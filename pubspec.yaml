name: pizzaapp
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.3.0
  cryptography: ^2.9.0
  file_picker: ^13.1.0
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  google_fonts: ^9.0.0
  pdf: ^3.13.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
